name: Ubuntu

on: [pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv "$RUNNER_TEMP/plotpy-venv"
          echo "$RUNNER_TEMP/plotpy-venv/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          python -m pip install "matplotlib>=3.10,<3.13"

      - name: Run tests
        run: cargo test -- --nocapture